 "options": ["Bee balm, mainly by drawing in pollinators", "Cattails, by forming dense floating root mats", "Big bluestem, via dense fibrous anchoring roots", "Purple coneflower, via one deep taproot ballast"], "answer": 2}, {"q": "Two identical BMPs, one in full sun and one at a shaded edge. Which species pairing fits the light guidance?", "options": ["Sun: golden alexanders; shade: coneflower", "Cattails in both, regardless of the light", "Big bluestem in sun; nothing viable in shade", "Sun: purple coneflower; shade: golden alexanders"], "answer": 3}, {"q": "A client wants prairie-style planting in a detention basin but has a two-year deadline. What is the key caution?", "options": ["Prairie can take 3–5 years to fully establish", "Prairie establishes within a few short weeks", "Prairie plantings cannot be used in basins", "Prairie must be torn out and replanted yearly"], "answer": 0}, {"q": "What trade-off does the module draw between prairie-style and individual (curated) plant selection?", "options": ["Prairie: more flexibility but far more weeds", "Prairie: fewer weeds; individual: more flexible", "Individual: always cheaper and faster to set", "Prairie: no need to match hydrology or soils"], "answer": 1}, {"q": "Beyond pollutant uptake, plants are credited with which combination of functions?", "options": ["Nutrient absorption and nothing more", "Structural load-bearing and pipe conveyance", "Filtration, sequestration, erosion, habitat", "A full substitute for engineered soil media"], "answer": 2}, {"q": "A designer wants targeted pollutant removal and specific habitat, accepting more upkeep. Which approach is this?", "options": ["Prairie-style mass planting for low upkeep", "Removing vegetation to reduce the upkeep", "Non-native ornamentals chosen for their looks", "Individual selection for specific plant traits"], "answer": 3}, {"q": "Which species is associated mainly with pollinator/habitat value rather than erosion control or N/P removal?", "options": ["Bee balm and black-eyed Susan, for pollinators", "Big bluestem, for anchoring erosion-prone soil", "Cattails, for nitrogen and phosphorus removal", "Golden alexanders, for shaded-edge performance"], "answer": 0}, {"q": "Why is soil composition still critical after hydrology has been addressed?", "options": ["Soil color sets the planting’s aesthetic value", "Soil governs roots, infiltration, and nutrients", "Soil is the true driver of light availability", "Soil stops mattering once plants are installed"], "answer": 1}]}, "2-1": {"title": "Foundations of GI, LID, and BMP Terminology", "questions": [{"q": "A bioretention facility designed to filter and infiltrate stormwater must satisfy which functional requirement to be classified as GI rather than simply a BMP?", "options": ["Performance of multiple hydrologic and ecological functions", "Presence of a pretreatment chamber", "Use of native vegetation", "Inclusion of engineered soil media"], "answer": 0}, {"q": "A system that collects runoff into a vegetated, shallow depression but includes an underdrain installed above the media bottom would be classified as:", "options": ["A conveyance device", "A detention basin", "A pure infiltration BMP", "A filtration-dominant bioretention cell"], "answer": 3}, {"q": "Which factor most accurately distinguishes LID from traditional BMP implementation?", "options": ["Depth of excavation", "Dependence on state-level permits", "Distributed hydrologic management at the sub-catchment scale", "Placement within the watershed rather than the site"], "answer": 2}, {"q": "A planner describes a permeable pavement retrofit as \"just drainage.\" Which statement explains why this classification is incorrect?", "options": ["They replace the need for downstream BMPs", "They eliminate surface ponding", "Permeable pavements always include vegetation", "Permeable pavements provide water-quality treatment and volume reduction"], "answer": 3}, {"q": "A design includes a bioswale with slopes > 8% but no internal check structures. Which hydrologic function will fail first?", "options": ["Evapotranspiration", "Peak flow bypass", "Filtration through side slopes", "Flow attenuation and residence time"], "answer": 3}, {"q": "A \"multifunctional\" GI system is defined by the ability to:", "options": ["Eliminate the need for erosion controls", "Integrate several hydrologic, ecological, and social co-benefits", "Store water temporarily and reduce thermal loading", "Replace municipal detention requirements"], "answer": 1}, {"q": "Which condition most strongly qualifies a subsurface infiltration trench as GI?", "options": ["It uses nonwoven geotextile", "It meets infiltration performance and reduces pollutant loads", "It is located above utilities", "It does not require vegetation"], "answer": 1}, {"q": "A BMP providing only temporary water storage without treatment would most accurately be categorized as:", "options": ["A conveyance practice", "A detention practice", "A filtration practice", "GI"], "answer": 1}, {"q": "During planning, a rain garden is mislabeled as a detention basin. This error will most likely cause:", "options": ["Incorrect overflow elevation design", "Excessive plant density", "Under-sized media reservoir", "Overuse of nonwoven geotextile"], "answer": 0}, {"q": "Confusion between \"infiltration\" and \"filtration\" BMPs most commonly causes:", "options": ["Overbuilt underdrain systems", "Incorrect media composition or depth", "Incorrect vegetation selection", "Oversized inlets"], "answer": 1}]}, "2-2": {"title": "Legal Responsibilities, Documentation & Permitting", "questions": [{"q": "A contractor excavates a bioretention basin before installing erosion controls, allowing sediment to migrate off-site. This constitutes a violation of:", "options": ["MS4 Construction Site Runoff Control minimum control measures", "State dam-safety regulations", "Local zoning requirements", "Section 404 of the Clean Water Act"], "answer": 0}, {"q": "Which condition trig y", "Prevent sediment loading into media during construction", "Increase storage volume"], "answer": 2}, {"q": "Exposure of subgrade to rainfall before reservoir installation leads to:", "options": ["Increased infiltration", "Soil sealing and loss of micro-porosity", "Lower pH", "Higher ET"], "answer": 1}, {"q": "Which buried-layer failure cannot be visually detected after construction?", "options": ["Incorrect vegetation spacing", "Sediment contamination of stone reservoir", "Mulch displacement", "Incorrect overflow height"], "answer": 1}, {"q": "Unwashed aggregate causes infiltration reduction because:", "options": ["It increases media volume", "It introduces fine sediments that clog pore networks", "It has too many large particles", "It drains too quickly"], "answer": 1}, {"q": "Early utility coordination is required because:", "options": ["Conflicts frequently require footprint or elevation redesign", "BMPs rely on sewer elevation", "Utilities must be removed", "Utilities help drain excess water"], "answer": 0}, {"q": "Sequencing permeable pavement differs from vegetated BMPs because pavements:", "options": ["Are extremely sensitive to sediment contamination during installation", "Require deeper excavation", "Require planting afterward", "Must be compacted"], "answer": 0}, {"q": "Critical QA/QC hold points include:", "options": ["Mowing", "Watering", "Mulch placement", "Photographic evidence of every buried layer before covering"], "answer": 3}, {"q": "Weather delays should adjust sequencing because:", "options": ["Rain events can destroy the infiltration subgrade", "Cold temperatures remove sediment", "Soil freezing improves media performance", "High humidity improves infiltration"], "answer": 0}, {"q": "A bypass condition is most commonly caused by:", "options": ["Overflow elevation set lower than media elevation", "Deep underdrain installation", "Correct check dam spacing", "Correct inlet geometry"], "answer": 0}]}, "2-6": {"title": "Retrofitting GI Into Existing Systems", "questions": [{"q": "Retrofits often require redesigned inlet structures because:", "options": ["Pretreatment is optional", "Slopes are always uniform", "Overflow structures must be eliminated", "Existing constraints limit flow distribution and hydraulic residence time"], "answer": 3}, {"q": "Permeable pavement is not recommended in retrofits where:", "options": ["Groundwater is deep", "Vegetation is dense", "Utilities are shallow or conflict with excavation depth", "Soils are sandy"], "answer": 2}, {"q": "Bioswale retrofits often require structural edges because:", "options": ["They cannot contain vegetation", "Urban soils are too deep", "Flow is too slow", "Adjacent paving creates erosive velocities requiring containment"], "answer": 3}, {"q": "Installing underdrains near old clay sanitary lines risks:", "options": ["Creating hydraulic connection that induces cross-contamination", "Increasing infiltration", "Superficial erosion", "Improving conveyance"], "answer": 0}, {"q": "Right-of-way retrofits must consider:", "options": ["Soil temperature", "Wildlife corridors", "Fertilizer use", "ADA and pedestrian conflict points"], "answer": 3}, {"q": "Retrofitting along steep slopes requires:", "options": ["Pretreatment and energy dissipation to prevent channelization", "Eliminating vegetation", "Replacing all soils", "Installing deeper check dams"], "answer": 0}, {"q": "Demolition-related retrofit work increases failure risk primarily due to:", "options": ["Shade loss", "pH changes", "Mobilized sediment overwhelming infiltration zones", "Thermal loading"], "answer": 2}, {"q": "The Philadelphia GI program demonstrates that retrofits require:", "options": ["Minimal permitting", "Complex multi-agency coordination and phased approvals", "No ROW work", "No pretreatment"], "answer": 1}, {"q": "Elevation tolerances tighten in retrofits because:", "options": ["Plants need deeper soil", "Geotextile overlaps shrink", "Adjacent infrastructure such as pavements and inlets cannot be modified", "Designers prefer compact sites"], "answer": 2}, {"q": "Retrofits often rely on hybrid green-gray systems because:", "options": ["Vegetation fails in retrofits", "Concrete is cheaper", "GI is banned near utilities", "GI cannot infiltrate in all contexts"], "answer": 3}]}, "2-7": {"title": "Post-Construction Stabilization, Establishment & Close-Out", "questions": [{"q": "Drawdown testing before close-out verifies:", "options": ["Mulch distribution", "Overflow design only", "Vegetation survival", "That infiltration and underdrain systems function according to design rates"], "answer": 3}, {"q": "Vegetation monitoring during establishment should focus on:", "options": ["Mulch decomposition", "Patterns of patchiness indicating hydrologic stress or compaction", "Soil temperature", "Leaf color only"], "answer": 1}, {"q": "Sediment removal from inlets before planting is critical because sediment will:", "options": ["Form preferential flow channels that bypass treatment", "Reduce pH", "Increase infiltration", "Prevent evaporation"], "answer": 0}, {"q": "Ponding beyond 48 hours is most commonly caused by:", "options": ["Compacted subgrade or clogged media", "Insufficient vegetation height", "Incorrect mulch selection", "Too much sunlight"], "answer": 0}, {"q": "Vegetation improves infiltration primarily by:", "options": ["Creating voids through root penetration", "Reducing soil structure", "Increasing ponding", "Lowering soil temperature"], "answer": 0}, {"q": "Photo documentation during construction is required because:", "options": ["It speeds permitting", "Colors indicate soil acidity", "All critical functional layers become invisible after media placement", "It reduces sedimentation"], "answer": 2}, {"q": "Stabilization of the contributing area is crucial because failure to stabilize it causes:", "options": ["High temperatures in media", "Nutrient loss", "Sediment loading that clogs infiltration systems", "Faster plant growth"], "answer": 2}, {" let userId = null;
let certNumber = null;
let moduleNumber = null;
let quizData = null;
let userAnswers = {};
let submitted = false;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  userId = session.user.id;

  const params = new URLSearchParams(window.location.search);
  certNumber = parseInt(params.get('cert')) || 1;
  moduleNumber = parseInt(params.get('module')) || 1;

  const key = `${certNumber}-${moduleNumber}`;
  quizData = QUIZ_BANK[key] || null;
  if (!quizData) {
    document.getElementById('loadingScreen').style.display = 'none';
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:DM Sans,sans-serif;padding:2rem;text-align:center"><div><h2 style="color:#085041">Quiz not available</h2><p style="color:#5a5a55">This module quiz has not been published yet.</p><a href="dashboard.html" style="color:#085041">← Back to dashboard</a></div></div>';
    return;
  }

  document.getElementById('navTitle').textContent = CERT_TITLES[certNumber];
  document.getElementById('navBadge').textContent = `Module ${moduleNumber} Quiz`;
  document.getElementById('quizLabel').textContent = `Certification ${certNumber} — Module ${moduleNumber}`;
  document.getElementById('quizTitle').textContent = quizData.title + ' — Quiz';
  document.getElementById('quizMeta').textContent = `${quizData.questions.length} questions · Pass with 80% or higher · Unlimited attempts (module restart required on fail)`;

  renderQuestions();

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('quizContent').style.display = 'block';
}

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  quizData.questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';

    let optionsHtml = q.options.map((opt, oi) => `
      <label class="option-label" id="opt-${qi}-${oi}">
        <input type="radio" name="q${qi}" value="${oi}" onchange="selectAnswer(${qi}, ${oi})">
        ${opt}
      </label>`).join('');

    card.innerHTML = `
      <div class="q-number">Question ${qi + 1} of ${quizData.questions.length}</div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optionsHtml}</div>`;

    container.appendChild(card);
  });

  updateSubmitNote();
}

function selectAnswer(qi, oi) {
  userAnswers[qi] = oi;
  // Highlight selected
  quizData.questions[qi].options.forEach((_, i) => {
    const lbl = document.getElementById(`opt-${qi}-${i}`);
    if (lbl) lbl.classList.toggle('selected', i === oi);
  });
  updateSubmitNote();
}

function updateSubmitNote() {
  const answered = Object.keys(userAnswers).length;
  const total = quizData.questions.length;
  const note = document.getElementById('submitNote');
  const btn = document.getElementById('submitBtn');

  if (answered < total) {
    note.textContent = `${answered} of ${total} questions answered. Answer all to submit.`;
    btn.disabled = true;
  } else {
    note.textContent = 'All questions answered. Ready to submit!';
    btn.disabled = false;
  }
}

async function submitQuiz() {
  if (submitted) return;
  submitted = true;

  const btn = document.getElementById('submitBtn');
  btn.classList.add('loading');
  btn.disabled = true;

  // Score
  let correct = 0;
  quizData.questions.forEach((q, qi) => {
    if (userAnswers[qi] === q.answer) correct++;
  });

  const score = Math.round((correct / quizData.questions.length) * 100);
  const passed = score >= 80;

  // Save to Supabase
  try {
    const { data: existing } = await sb.from('module_progress')
      .select('quiz_attempts').eq('user_id', userId)
      .eq('cert_number', certNumber).eq('module_number', moduleNumber).single();

    const attempts = (existing?.quiz_attempts || 0) + 1;

    await sb.from('module_progress').upsert({
      user_id: userId,
      cert_number: certNumber,
      module_number: moduleNumber,
      quiz_passed: passed,
      quiz_score: score,
      quiz_attempts: attempts,
      status: passed ? 'passed' : 'in_progress',
      quiz_passed_date: passed ? new Date().toISOString() : null,
      current_slide: passed ? undefined : 0,
      last_accessed: new Date().toISOString()
    }, { onConflict: 'user_id,cert_number,module_number' });

  } catch (e) { console.error('Save error:', e); }

  showResults(score, passed, correct);
}

function showResults(score, passed, correct) {
  document.getElementById('quizContent').style.display = 'none';
  const result = document.getElementById('resultScreen');
  result.classList.add('show');

  document.getElementById('resultIcon').textContent = passed ? '🎉' : '📚';
  document.getElementById('resultTitle').textContent = passed ? 'Quiz Passed!' : 'Not quite — let\'s review';
  document.getElementById('resultScore').innerHTML = `<span class="${passed ? 'score-pass' : 'score-fail'}">${score}%</span>`;

  const total = quizData.questions.length;

  if (passed) {
    // Module counts per cert — used to detect the final module and route to the exam.
    const MODULE_COUNTS = { 1: 7, 2: 8, 3: 6, 4: 6 };
    const isLastModule = moduleNumber >= (MODULE_COUNTS[certNumber] || 99);
    if (isLastModule) {
      document.getElementById('resultDesc').textContent = `You answered ${correct} out of ${total} questions correctly. You've completed the final module — the last step is your certification exam.`;
      document.getElementById('resultActions').innerHTML = `
      <a href="exam.html?cert=${certNumber}" class="result-btn btn-green">Take Final Exam →</a>
      <a href="dashboard.html" class="result-btn btn-outline">Back to dashboard</a>`;
    } else {
      document.getElementById('resultDesc').textContent = `You answered ${correct} out of ${total} questions correctly. Well done! You've unlocked the next module.`;
      document.getElementById('resultActions').innerHTML = `
      <a href="viewer.html?cert=${certNumber}&module=${moduleNumber + 1}" class="result-btn btn-green">Continue to next module →</a>
      <a href="dashboard.html" class="result-btn btn-outline">Back to dashboard</a>`;
    }
  } else {
    document.getElementById('resultDesc').textContent = `You answered ${correct} out of ${total} questions correctly — ${score}% (need 80% to pass). You'll need to review the module slides and retake the quiz. Your progress for this module has been reset.`;
    document.getElementById('resultActions').innerHTML = `
      <a href="viewer.html?cert=${certNumber}&module=${moduleNumber}" class="result-btn btn-gold">Review module slides →</a>
      <a href="dashboard.html" class="result-btn btn-outline">Back to dashboard</a>`;
  }
}

init();
</script>
